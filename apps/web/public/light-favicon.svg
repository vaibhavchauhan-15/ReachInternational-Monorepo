<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <!-- Base Chassis -->
  <rect x="12" y="82" width="68" height="6" rx="3" fill="#0f172a" />
  <circle cx="22" cy="91" r="4.5" fill="#0f172a" />
  <circle cx="70" cy="91" r="4.5" fill="#0f172a" />

  <!-- Hydraulic Base Mounts -->
  <rect x="18" y="78" width="8" height="4" fill="#0f172a" />
  <rect x="66" y="78" width="8" height="4" fill="#0f172a" />

  <!-- Scissor Arms (Bottom X) -->
  <path d="M22 82 L70 54" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
  <path d="M70 82 L22 54" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
  <circle cx="46" cy="68" r="3" fill="#0f172a" />

  <!-- Scissor Arms (Top X) -->
  <path d="M22 54 L70 26" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
  <path d="M70 54 L22 26" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
  <circle cx="46" cy="40" r="3" fill="#0f172a" />

  <!-- Hydraulic Cylinder -->
  <line x1="46" y1="78" x2="46" y2="28" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.4" />

  <!-- Top Platform -->
  <rect x="10" y="20" width="72" height="6" rx="2" fill="#0f172a" />

  <!-- Guardrails -->
  <path d="M14 20 V8 H78 V20" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M46 20 V8" stroke="#0f172a" stroke-width="2.5" />

  <!-- Upward Height Arrow (Brand Blue) -->
  <g fill="none">
    <path d="M89 54 V10" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round" />
    <path d="M81 18 L89 8 L97 18" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>