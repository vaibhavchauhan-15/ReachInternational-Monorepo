# ==============================================================================
# ReachInternational Web — Netlify Monorepo & Subdirectory Configuration
# ==============================================================================
# Seamless Next.js 16 App Router deployment on Netlify via pnpm & Turborepo.
# In Netlify monorepos with root base directory, publish points to apps/web/.next.
# Vercel (vercel.json) and Cloudflare (wrangler.jsonc) configurations remain intact.
# ==============================================================================

[build]
  command = "pnpm build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.21.0"
  NETLIFY = "true"
