# ------------------------------------------------------------------------------
# Scheduled Cron Functions (100% Parity with Vercel & Cloudflare Crons)
# ------------------------------------------------------------------------------
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Daily 02:00 UTC - Purge unreferenced doc_staging sessions older than 24h
[functions."cleanup-staging"]
  schedule = "0 2 * * *"

# Daily 03:00 UTC - Purge orphaned superseded user_documents older than 90d
[functions."cleanup-superseded"]
  schedule = "0 3 * * *"

# Daily 00:00 UTC - Close expired job postings
[functions."close-expired-jobs"]
  schedule = "0 0 * * *"

# ------------------------------------------------------------------------------
# Static Assets & Service Worker Caching Rules
# ------------------------------------------------------------------------------
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), clipboard-read=(self), clipboard-write=(self)"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
