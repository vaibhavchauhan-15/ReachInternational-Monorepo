// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

subprojects { subproject ->
  def configureCxx = {
    if (System.getProperty("os.name", "").toLowerCase().contains("windows") && subproject.hasProperty("android")) {
      try {
        def cmake = subproject.android.externalNativeBuild?.cmake
        if (cmake != null && cmake.path != null) {
          def targetDir = new File("C:/cxx/s", subproject.name)
          targetDir.mkdirs()
          cmake.buildStagingDirectory = targetDir
          println "[CXX Relocate] Relocated ${subproject.name} CXX buildStagingDirectory to ${targetDir.absolutePath}"
        }
      } catch (Throwable t) {
        // Ignored
      }
    }
  }

  if (subproject.state.executed) {
    configureCxx()
  } else {
    subproject.afterEvaluate { configureCxx() }
  }
}
