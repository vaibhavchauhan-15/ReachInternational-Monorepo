# ==============================================================================
# ReachInternational Monorepo — Netlify Production & Preview Configuration
# ==============================================================================
# Seamless Next.js 16 App Router deployment on Netlify via pnpm & Turborepo.
# Vercel (vercel.json) and Cloudflare (wrangler.jsonc) configurations remain intact.
# ==============================================================================

[build]
  # Monorepo root is the base directory for pnpm workspace dependency resolution
  base = "."
  # Build command executes the build dispatcher (detects Netlify -> Turborepo web build)
  command = "node scripts/build-dispatcher.js"
  # Next.js build output directory relative to repository root
  publish = "apps/web/.next"

[build.environment]
  # Node.js 22 LTS runtime (required for pnpm v11 & node:sqlite built-in module)
  NODE_VERSION = "22"
  # Authoritative monorepo package manager version (matching package.json & pnpm-workspace.yaml)
  PNPM_VERSION = "11.21.0"
  # Netlify environment marker
  NETLIFY = "true"
  # Netlify Secrets Scanner Configuration
  # Exclude public / client-safe environment variables from triggering secret scanning failures
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_GA_MEASUREMENT_ID,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_VAPID_PUBLIC_KEY,VAPID_SUBJECT,PUSH_ENABLED,NEXT_PUBLIC_APP_VERSION,NEXT_PUBLIC_ENABLE_AGENTATION,NEXT_PUBLIC_ENABLE_PULL_TO_REFRESH,NEXT_PUBLIC_SENTRY_DSN"
  # Exclude repository documentation, change logs, templates, tests, and reports from scanning
  SECRETS_SCAN_OMIT_PATHS = ".env.example,apps/web/.env.example,apps/mobile/.env.example,apps/web/.dev.vars.example,AI/**,docs/**,runbooks/**,tests/**,apps/web/scripts/**,scripts/**,README.md"
  # Essential public environment variables for Next.js static page compilation
  NEXT_PUBLIC_SUPABASE_URL = "https://dhbbgfzbyatzvqafnsqp.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_FL-1BqCcGNxYByFYzrBWuA_BvHMxVis"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoYmJnZnpieWF0enZxYWZuc3FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NTQyNDcsImV4cCI6MjEwMTIzMDI0N30.4ZHaKqZ-VIzB2-6kOkhIA-j0xpCmN5j5pJIWpfdyat8"
  NEXT_PUBLIC_APP_VERSION = "1.5.0"
  NEXT_PUBLIC_GA_MEASUREMENT_ID = "G-DC126P3SM9"
  NEXT_PUBLIC_ENABLE_AGENTATION = "false"
  NEXT_PUBLIC_ENABLE_PULL_TO_REFRESH = "true"
