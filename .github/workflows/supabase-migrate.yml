name: Supabase Migrate

on:
  push:
    branches: [development, production]
    paths:
      - "supabase/migrations/**"
  pull_request:
    branches: [production]
    paths:
      - "supabase/migrations/**"

jobs:
  # Runs on every PR into production — no writes, just a dry-run diff.
  dry-run:
    if: github.event_name == 'pull_request'
    name: Migration Dry-Run (Production)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" -p "$SUPABASE_DB_PASSWORD"
          supabase db diff --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # Runs on real pushes to development or production — applies migrations.
  migrate:
    if: github.event_name == 'push'
    name: Apply Migrations
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" -p "$SUPABASE_DB_PASSWORD"
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
