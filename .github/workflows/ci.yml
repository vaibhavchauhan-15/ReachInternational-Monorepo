name: ReachInternational Monorepo — CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    name: Validation & Typecheck Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.21.0

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Workspace Typecheck Validation
        run: pnpm typecheck

      - name: Mobile Package Typecheck Validation
        run: pnpm --filter @reachinternational/mobile typecheck

      - name: Run Mobile Test Suite
        run: node apps/mobile/run-tests.mjs
