name: ReachInternational Monorepo — CI Pipeline

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [production]

jobs:
  validate:
    name: Validation & Typecheck Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.21.0

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Workspace Typecheck Validation
        run: pnpm typecheck

      - name: Mobile Package Typecheck Validation
        run: pnpm --filter @reachinternational/mobile typecheck

      - name: Typography Guard Validation
        run: pnpm check:type

      - name: Design Tokens Invariant Test Suite
        run: pnpm --filter @reachinternational/design-tokens test

      - name: Run Mobile Test Suite
        run: node apps/mobile/run-tests.mjs

      - name: Run Permissions RBAC Test Suite
        run: pnpm --filter @reachinternational/permissions test

      - name: Web Application Build Validation
        run: pnpm --filter @reachinternational/web build

      # Guard: Catch Supabase RPC / schema type drift before it reaches production.
      # Fails if the committed packages/types/src/database.ts diverges from what
      # `supabase gen types` would produce against the dev project.
      # Requires SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID secrets.
      - name: Supabase Type Drift Check
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: vlmxciuogczumumrwyot
        run: |
          npx supabase gen types typescript --project-id $SUPABASE_PROJECT_ID > /tmp/generated_types.ts
          if ! diff -q /tmp/generated_types.ts packages/types/src/database.ts > /dev/null 2>&1; then
            echo "❌ Supabase type drift detected! Run: npx supabase gen types typescript --project-id $SUPABASE_PROJECT_ID > packages/types/src/database.ts"
            diff /tmp/generated_types.ts packages/types/src/database.ts
            exit 1
          fi
          echo "✅ Supabase types are in sync with the database schema."

